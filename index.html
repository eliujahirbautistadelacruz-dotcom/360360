<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Copiar Código</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #667eea, #764ba2);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .card {
    background: white;
    padding: 40px 30px;
    border-radius: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    text-align: center;
    max-width: 350px;
    width: 90%;
  }
  h2 {
    margin: 0 0 10px 0;
    color: #333;
  }
  p {
    color: #666;
    font-size: 14px;
    margin-bottom: 25px;
  }
  .code-box {
    background: #f3f4f6;
    padding: 15px;
    border-radius: 10px;
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 1px;
    color: #333;
    margin-bottom: 25px;
    border: 2px dashed #d1d5db;
  }
  button {
    width: 100%;
    padding: 16px;
    font-size: 17px;
    font-weight: bold;
    color: white;
    background: #764ba2;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s;
  }
  button:active {
    transform: scale(0.96);
    background: #5b3a8a;
  }
  #mensaje {
    margin-top: 15px;
    font-size: 14px;
    color: #10b981;
    font-weight: bold;
    opacity: 0;
    transition: opacity 0.3s;
  }
  #mensaje.show {
    opacity: 1;
  }
</style>
</head>
<body>

<div class="card">
  <h2>Tu código</h2>
  <p>Toca el botón para copiarlo</p>
  
  <div class="code-box">728969000040265927</div>
  
  <button id="btnCopiar" onclick="copiarCodigo()">📋 Copiar Código</button>
  
  <div id="mensaje">¡Copiado al portapapeles! ✓</div>
</div>

<script>
  function copiarCodigo() {
    const codigo = "7289690000040265927";
    
    navigator.clipboard.writeText(codigo).then(() => {
      const btn = document.getElementById("btnCopiar");
      const msg = document.getElementById("mensaje");
      
      btn.innerHTML = "¡Copiado! ✓";
      msg.classList.add("show");
      
      setTimeout(() => {
        btn.innerHTML = "📋 Copiar Código";
        msg.classList.remove("show");
      }, 2000);
      
    }).catch(() => {
      // Fallback para navegadores viejos
      const input = document.createElement("input");
      input.value = codigo;
      document.body.appendChild(input);
      input.select();
      document.execCommand("copy");
      document.body.removeChild(input);
      alert("Código copiado: " + codigo);
    });
  }
</script>

</body>
</html>
